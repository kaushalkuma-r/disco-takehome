[project]
name = "campaign-studio-backend"
version = "0.1.0"
description = "Disco Campaign Studio — agentic ad placement & creative generation API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "asyncpg>=0.29",
  "openai>=1.50",
  "PyJWT[crypto]>=2.9",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "fpdf2>=2.7",
  "python-dotenv>=1.0",
  "langfuse>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
